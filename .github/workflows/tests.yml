name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q bot.py player_store.py explicit_roster_io.py sheet_watcher.py tools
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/test_player_store.py
